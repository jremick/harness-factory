[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "harness-factory"
version = "0.2.0a1"
description = "Build, analyse, validate, and independently evaluate AI agent harnesses"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "Jinja2>=3.1,<4",
  "jsonschema[format]==4.25.1",
  "pydantic>=2.12,<3",
  "PyYAML==6.0.3",
  "typer>=0.21,<1",
]

[project.scripts]
harness = "hdp.cli:harness_main"
hdp = "hdp.cli:main"

[tool.hatch.build.targets.sdist]
only-include = [
  "src/hdp",
  "examples/software-development/hdp.yaml",
  "examples/software-development/bindings/codex.yaml",
  "pyproject.toml",
  "README.md",
  "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hdp"]

[tool.hatch.build.targets.wheel.force-include]
"src/hdp/schemas/hdp.schema.json" = "hdp/schemas/hdp.schema.json"
"examples/software-development/hdp.yaml" = "hdp/templates/codex-sdlc/hdp.yaml"
"examples/software-development/bindings/codex.yaml" = "hdp/templates/codex-sdlc/bindings/codex.yaml"

[dependency-groups]
dev = [
  "hypothesis>=6.0,<7",
  "pytest>=9.0,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["hdp"]
