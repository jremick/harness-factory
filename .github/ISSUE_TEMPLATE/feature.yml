name: Feature request
description: Propose a narrowly scoped, evidence-backed improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user outcome and current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful change
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and acceptance check
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Contract boundaries
      options:
        - label: This keeps target-specific fields out of canonical HDP/HIR semantics.
          required: true
